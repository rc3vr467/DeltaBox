name: OSS Verify

# Real verification of the OSS release variant: native libcore build, resource
# linking, Kotlin compilation, unit tests and APK assembly. Every step is a
# real command; a failing step fails the job.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: oss-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify OSS release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod +x run gradlew libcore/*.sh && find buildScript libcore/buildScript -name '*.sh' -exec chmod +x {} + || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

      - name: Show toolchain
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          ls "${ANDROID_HOME}/ndk" || true
          go version
          java -version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-verify-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: Build native libcore (app/libs/libcore.aar)
        run: ./run lib core

      - name: Verify libcore.aar exists
        run: test -s app/libs/libcore.aar

      - name: Prepare local.properties and assets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> local.properties
          ./run init action gradle

      - name: Clean
        run: ./gradlew clean

      - name: Resource linking (processOssReleaseResources)
        run: ./gradlew :app:processOssReleaseResources --stacktrace

      - name: Kotlin compile (compileOssReleaseKotlin)
        run: ./gradlew :app:compileOssReleaseKotlin --stacktrace

      - name: Unit tests (testOssReleaseUnitTest)
        run: ./gradlew :app:testOssReleaseUnitTest --stacktrace

      - name: Assemble OSS release
        run: ./gradlew :app:assembleOssRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deltabox-oss-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
